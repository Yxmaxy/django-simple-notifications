[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-simple-notifications"
dynamic = ["version"]
description = "A simple Django app for notifications"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Marko Vrečer" }
]
license = { text = "MIT" }
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "Django>=4.2",
    "djangorestframework>=3.16",
    "python-dotenv>=1.1",
    "pywebpush>=2.0",
]

[project.optional-dependencies]
dev = [
    "pylint>=3.3",
    "pylint-django>=2.6",
    "black>=25.1",
]

[project.urls]
Homepage = "https://github.com/Yxmaxy/django-simple-notifications"
Repository = "https://github.com/Yxmaxy/django-simple-notifications.git"

[tool.setuptools]
package-dir = {"" = "backend"}
packages = ["simple_notifications"]
include-package-data = true

[tool.setuptools.package-data]
"simple_notifications" = ["migrations/*.py", "migrations/*/*.py", "templates/*.txt"]

[tool.setuptools.dynamic]
version = {file = "version.txt"}

[tool.uv]
exclude-newer = "2026-04-26T00:00:00Z"
